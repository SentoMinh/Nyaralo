<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <title>Admin – Foglalások</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
  <div class="max-w-7xl mx-auto p-6">
    <h1 class="text-3xl font-bold mb-6">Foglalások kezelése</h1>
    <div class="bg-white rounded-xl shadow overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-gray-50">
          <tr>
            <th class="p-3 text-left">ID</th>
            <th class="p-3 text-left">Vendég</th>
            <th class="p-3 text-left">Érkezés – Távozás</th>
            <th class="p-3 text-left">Vendégek</th>
            <th class="p-3 text-left">Összeg</th>
            <th class="p-3 text-left">Státusz</th>
            <th class="p-3 text-left">Fizetés</th>
            <th class="p-3 text-left">Műveletek</th>
          </tr>
        </thead>
        <tbody id="bookings-table"></tbody>
      </table>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
